name: Build and Package Windows Executable

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Application
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore NuGet Packages
      run: dotnet restore Meetily.sln

    - name: Build Solution (Release)
      run: dotnet build Meetily.sln --configuration Release --no-restore

    - name: Publish Self-Contained Windows Executable
      run: |
        dotnet publish src/Meetily.App/Meetily.App.csproj `
          --configuration Release `
          --runtime win-x64 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          --output ./publish

    - name: Download Whisper Base Model
      run: |
        New-Item -ItemType Directory -Force -Path ./publish/models
        Write-Host "Downloading ggml-base.bin model..."
        Invoke-WebRequest -Uri "https://huggingface.co/chatgpt-openai/ggml-model-whisper/resolve/main/ggml-base.en.bin" -OutFile "./publish/models/ggml-base.bin"
        Write-Host "Model downloaded successfully to ./publish/models/ggml-base.bin"

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Meetily-Windows-x64
        path: ./publish/
        if-no-files-found: error

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: ./publish/*
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
